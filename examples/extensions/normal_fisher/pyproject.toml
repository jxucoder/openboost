[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "openboost-example-normal-fisher"
version = "0.2.0"
description = "Independent OpenBoost experimental normal_fisher example"
requires-python = ">=3.10"
dependencies = ["openboost==1.0.0rc1", "numpy>=1.24"]

[project.optional-dependencies]
cuda = ["openboost[cuda]==1.0.0rc1"]

[tool.hatch.build.targets.wheel]
packages = ["src/normal_fisher"]

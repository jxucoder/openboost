name: v1 GPU Validation Requires an Approved Packet

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  unavailable:
    runs-on: ubuntu-latest
    steps:
      - name: Explain current v1 boundary
        run: |
          echo "Experimental CUDA components and recipes have committed real-device evidence."
          echo "This hosted CPU job performs no GPU validation. Use a frozen packet and its separate hardware/upload allowance."
          echo "See v1-sprints/README.md for the current evidence and execution boundary."
          exit 1

name: v1 Reference Checks

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  references:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - uses: astral-sh/setup-uv@v4
      - run: uv sync --locked --extra test
      - run: uv run --no-sync ruff check src/openboost tests/v1 tests/conftest.py
      - name: Run current v1 references, not retired production tests
        run: uv run --no-sync pytest tests/ -n 0 -q
      - run: uv build

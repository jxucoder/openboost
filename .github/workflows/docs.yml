name: v1 Documentation Modal Gate

on:
  push:
    branches: [main]
    paths: ['docs/v1/**', 'mkdocs.yml', '.github/**']
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths: ['docs/v1/**', 'mkdocs.yml', '.github/**']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Verify exact-candidate Modal documentation and prerequisite results
        run: python3 .github/scripts/check_modal_validation.py

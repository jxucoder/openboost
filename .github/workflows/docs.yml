name: Build v1 Documentation

on:
  push:
    branches: [main]
    paths: ['docs/v1/**', 'mkdocs.yml']
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths: ['docs/v1/**', 'mkdocs.yml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    # Draft checkpoint review does not launch heavy validation. Skips are not passes.
    if: ${{ github.event_name != 'pull_request' || !github.event.pull_request.draft }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v4
      - run: uv sync --locked
      - run: uv run --no-sync mkdocs build --strict

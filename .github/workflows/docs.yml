name: Build v1 Documentation

on:
  push:
    branches: [main]
    paths: ['docs/v1/**', 'mkdocs.yml']
  pull_request:
    paths: ['docs/v1/**', 'mkdocs.yml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v4
      - run: uv sync --locked
      - run: uv run --no-sync mkdocs build --strict
